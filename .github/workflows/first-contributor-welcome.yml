name: First-Time Contributor Welcome

# Reads only the author and their earlier items; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest

    steps:
      - name: Send welcome message
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = Boolean(context.payload.pull_request);
            const item = context.payload.pull_request || context.payload.issue;
            const author = item?.user?.login;
            const isBot = item?.user?.type === 'Bot';

            // Skip bots and the repository owner.
            if (!author || isBot || item?.author_association === 'OWNER') {
              core.info(`Skipping welcome for ${author} (type: ${item?.user?.type}, association: ${item?.author_association}).`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              creator: author,
              per_page: 10,
            });
            const mine = all.filter(i => Boolean(i.pull_request) === isPR);

            // Only their very first PR, or their very first issue.
            if (mine.length !== 1) {
              core.info(`${author} has ${mine.length} ${isPR ? 'PRs' : 'issues'}; not their first.`);
              return;
            }

            const body = isPR
              ? [
                  '<!-- first-pr-welcome -->',
                  `👋 Welcome @${author} and thank you for opening your first pull request in the SparkyFitness Exercise Library! 🎉`,
                  '',
                  'We will review it soon. Please make sure the mandatory checkboxes in your description are ticked so the checks can pass, and that `pnpm validate` and `pnpm build` ran cleanly with the rebuilt `dist/exercises.json` committed.',
                ]
              : [
                  '<!-- first-issue-welcome -->',
                  `👋 Welcome @${author} and thank you for opening your first issue in the SparkyFitness Exercise Library! 🌟`,
                  '',
                  'We will take a look soon. If you are reporting wrong exercise data, the exercise ID (for example `sf-core-oth-0002`) and a source help us fix it quickly.',
                ];

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: item.number,
              body: body.join('\n'),
            });
            core.info(`Posted first-time ${isPR ? 'PR' : 'issue'} welcome comment for ${author}.`);
