name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install ffmpeg (video checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate exercises
        run: node scripts/validate.mjs
      - name: Build catalog
        # dist/ and locales/en/ are rebuilt and committed by the Sync catalog workflow after a merge,
        # so contributors do not have to. The build only has to succeed here.
        run: node scripts/build.mjs
      - name: Test the catalog rules
        run: node --test "scripts/lib/*.test.mjs"

  site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build catalog
        run: node scripts/build.mjs
      - name: Build site
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
